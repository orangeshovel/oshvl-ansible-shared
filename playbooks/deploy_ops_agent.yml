---
# Deploys oshvl-ops-agent-shared: daily backup/log-monitor/digest job +
# weekly disk-cleanup job. Shared across orangeshovel/lonebirchlab/
# projectunmute via FQCN (oshvl.infra.deploy_ops_agent) so the deploy logic
# itself is never copy-pasted 3x and kept "at parity" by hand — see this
# collection's setup_github_runner.yml for the same pattern, and
# setup_compute_master.yml in each consumer repo for the drift this avoids.
#
# Required vars:
#   target_host          - inventory host to deploy to
#   ops_agent_repo_version - pinned git tag/ref of oshvl-ops-agent-shared to
#                            deploy (NOT "main" — see README for why this
#                            repo is pinned, unlike this collection's own
#                            floating ref)
#   ops_agent_runner_user  - OS user the org's self-hosted runner runs as
#   ops_agent_targets      - list of cleanup target dicts (see
#                            oshvl-ops-agent-shared/targets.yml.example)
#
# Required only when ops_agent_enable_daily is true (the default):
#   ops_agent_db_host/db_name/db_user/db_password - PostgreSQL connection
#                            for the daily backup job
#   ops_agent_s3_bucket    - S3 bucket for the daily backup job
#   ops_agent_shovel_bot_api_key - shovel.bot API key for alerts/digest
#
# Optional vars:
#   ops_agent_enable_daily      - default true. Set false for an org with no
#                            existing DB backup / S3 / shovel.bot integration
#                            to deploy (see cleanup mode below).
#   ops_agent_apply             - "true"/"false", default "false" (dry-run)
#   ops_agent_daily_schedule    - default "05:05:00"
#   ops_agent_cleanup_schedule  - default "weekly"
#   ops_agent_journal_vacuum_size - default "500M"
#   ops_agent_claude_version_homes - default [/home/{{ ops_agent_runner_user }}]
#   ops_agent_db_port           - default "5432"
#   ops_agent_s3_region         - default "us-east-1"
#   ops_agent_shovel_bot_url    - default "https://api.shovel.bot"
#   ops_agent_shovel_bot_channel - default "#all-orangeshovel"
#
# Cleanup-only mode (ops_agent_enable_daily: false): skips the daily
# backup/log-monitor/digest job and its systemd unit entirely — only the
# weekly disk-cleanup job gets deployed. For an org with no existing
# Postgres-backup/S3/shovel.bot setup to plug into, this avoids either
# fabricating placeholder secrets or provisioning new cloud infrastructure
# just to stand up disk cleanup. None of the daily-job vars above need to be
# set in this mode.
#
# Usage (e.g. from a consumer repo's own compute-node ops-agent playbook):
#   ansible-playbook oshvl.infra.deploy_ops_agent \
#     -i inventory/production \
#     -e target_host=compute.example.lan \
#     -e ops_agent_repo_version=v0.1.0 \
#     -e ops_agent_runner_user=your-repo-runner \
#     -e @host_vars/compute.example.lan/ops_agent.yml \
#     --ask-vault-pass --ask-become-pass

- name: Deploy oshvl-ops-agent
  hosts: "{{ target_host }}"
  become: yes
  vars:
    app_name: oshvl-ops-agent
    app_user: ops-agent
    app_base_dir: /opt/oshvl-ops-agent
    ops_agent_log_dir: /app-data/oshvl-ops-agent/logs
    ops_agent_report_dir: /app-data/oshvl-ops-agent/reports
    ops_agent_export_dir: /app-data/oshvl-ops-agent/exports
    # Defaulted at each usage site below via `| default(...)`, not reassigned
    # here — self-referential `foo: "{{ foo | default(...) }}"` at play-vars
    # scope causes infinite template recursion when the caller doesn't pass it.

  pre_tasks:
    - name: Assert required ops_agent vars are set
      assert:
        that:
          - ops_agent_repo_version is defined
          - ops_agent_repo_version | length > 0
          - ops_agent_runner_user is defined
          - ops_agent_runner_user | length > 0
        fail_msg: >-
          ops_agent_repo_version and ops_agent_runner_user must both be set
          explicitly by the caller — see this playbook's header comment.

  roles:
    - role: oshvl.infra.python_app
      vars:
        python_app_extra_packages: >-
          {{ ['awscli'] if (ops_agent_enable_daily | default(true) | bool) else [] }}

    - role: oshvl.infra.app_user
      vars:
        app_user_name: "{{ app_user }}"
        app_user_comment: "Compute node disk cleanup / housekeeping"

    - role: oshvl.infra.app_directories
      vars:
        app_dir_name: "{{ app_name }}"
        app_dir_base: "{{ app_base_dir }}"
        app_dir_user: "{{ app_user }}"
        app_log_dir: "{{ ops_agent_log_dir }}"
        app_data_dir: "{{ ops_agent_report_dir }}"

    - role: oshvl.infra.app_env
      vars:
        app_env_name: "{{ app_name }}"
        app_env_dest: "{{ app_base_dir }}/.env"
        app_env_template: ops-agent-env.j2
        app_env_user: "{{ app_user }}"
        app_env_vars:
          # Cleanup job
          APPLY: "{{ ops_agent_apply | default('false') }}"
          LOG_DIR: "{{ ops_agent_log_dir }}"
          REPORT_DIR: "{{ ops_agent_report_dir }}"
          RUNNER_USER: "{{ ops_agent_runner_user }}"
          RUNNER_HOME: "/home/{{ ops_agent_runner_user }}"
          # Daily job — database backup (unused, left blank, when
          # ops_agent_enable_daily is false — no daily systemd unit exists
          # to ever read them in that mode)
          EXPORT_DIR: "{{ ops_agent_export_dir }}"
          PG_HOST: "{{ ops_agent_db_host | default('') }}"
          PG_PORT: "{{ ops_agent_db_port | default('5432') }}"
          PG_DATABASE: "{{ ops_agent_db_name | default('') }}"
          PG_USER: "{{ ops_agent_db_user | default('') }}"
          PG_PASSWORD: "{{ ops_agent_db_password | default('') }}"
          S3_BUCKET: "{{ ops_agent_s3_bucket | default('') }}"
          S3_REGION: "{{ ops_agent_s3_region | default('us-east-1') }}"
          AWS_ACCESS_KEY_ID: "{{ ops_agent_aws_access_key_id | default('') }}"
          AWS_SECRET_ACCESS_KEY: "{{ ops_agent_aws_secret_access_key | default('') }}"
          # Daily job — Slack via shovel.bot
          SHOVEL_BOT_URL: "{{ ops_agent_shovel_bot_url | default('https://api.shovel.bot') }}"
          SHOVEL_BOT_API_KEY: "{{ ops_agent_shovel_bot_api_key | default('') }}"
          SHOVEL_BOT_CHANNEL: "{{ ops_agent_shovel_bot_channel | default('#all-orangeshovel') }}"

    - role: oshvl.infra.ops_agent_sudo
      vars:
        ops_agent_sudo_runner_home: "/home/{{ ops_agent_runner_user }}"
        ops_agent_sudo_journal_vacuum_size: "{{ ops_agent_journal_vacuum_size | default('500M') }}"
        ops_agent_sudo_claude_version_homes: >-
          {{ ops_agent_claude_version_homes | default(['/home/' + ops_agent_runner_user]) }}

    - role: oshvl.infra.systemd_service
      when: ops_agent_enable_daily | default(true) | bool
      vars:
        systemd_service_name: oshvl-ops-agent-daily
        systemd_service_description: "oshvl-ops-agent daily backup, log monitor, and digest"
        systemd_service_type: oneshot
        systemd_service_user: "{{ app_user }}"
        systemd_service_group: "{{ app_user }}"
        systemd_service_working_dir: "{{ app_base_dir }}/current"
        systemd_service_exec_start: /usr/bin/make run-daily
        systemd_service_environment_file: "{{ app_base_dir }}/.env"
        systemd_service_environment:
          PATH: "{{ app_base_dir }}/current/venv/bin:/usr/local/bin:/usr/bin:/bin"
        systemd_service_after:
          - network-online.target
          - postgresql.service
        systemd_service_wants:
          - network-online.target
        systemd_timer_enabled: true
        systemd_timer_on_calendar: "{{ ops_agent_daily_schedule | default('05:05:00') }}"
        systemd_timer_persistent: true

    - role: oshvl.infra.systemd_service
      vars:
        systemd_service_name: oshvl-ops-agent-cleanup
        systemd_service_description: "oshvl-ops-agent weekly disk cleanup"
        systemd_service_type: oneshot
        systemd_service_user: "{{ app_user }}"
        systemd_service_group: "{{ app_user }}"
        systemd_service_working_dir: "{{ app_base_dir }}/current"
        systemd_service_exec_start: /usr/bin/make run-cleanup
        systemd_service_environment_file: "{{ app_base_dir }}/.env"
        systemd_service_environment:
          PATH: "{{ app_base_dir }}/current/venv/bin:/usr/local/bin:/usr/bin:/bin"
        systemd_service_no_new_privileges: false  # required: this unit calls sudo -n; role default (NoNewPrivileges=yes) blocks that
        systemd_timer_enabled: true
        systemd_timer_on_calendar: "{{ ops_agent_cleanup_schedule | default('weekly') }}"
        systemd_timer_persistent: true

    - role: oshvl.infra.log_rotation
      vars:
        logrotate_name: oshvl-ops-agent
        _logrotate_logs_config:
          - logs:
              - "{{ ops_agent_log_dir }}/*.log"
            user: "{{ app_user }}"
            group: service-accounts
            rotate: 90
            size: 50M
        _logrotate_exports_config:
          - logs:
              - "{{ ops_agent_export_dir }}/*.sql"
              - "{{ ops_agent_export_dir }}/*.sql.gz"
            user: "{{ app_user }}"
            group: service-accounts
            rotate: 7
            size: 100M
            compress: false
        logrotate_configs: >-
          {{ _logrotate_logs_config + (_logrotate_exports_config if (ops_agent_enable_daily | default(true) | bool) else []) }}

  post_tasks:
    # Runs after app_directories (which creates repo/ and current/ as plain
    # placeholder directories) and app_user (which creates the ops-agent
    # user these are cloned/owned as) — both roles above. Every other app in
    # this ecosystem gets its repo/current populated by its own product
    # repo's CI (.github/actions/prepare-deploy), which this standalone repo
    # has no equivalent of, so the playbook does it directly here instead.
    - name: Clone/update oshvl-ops-agent-shared at a pinned version
      ansible.builtin.git:
        repo: https://github.com/orangeshovel/oshvl-ops-agent-shared.git
        dest: "{{ app_base_dir }}/repo"
        version: "{{ ops_agent_repo_version }}"
        force: yes
      become_user: "{{ app_user }}"

    - name: Symlink current -> repo
      ansible.builtin.file:
        src: "{{ app_base_dir }}/repo"
        dest: "{{ app_base_dir }}/current"
        state: link
        force: yes  # app_directories already created `current` as a plain directory
        owner: "{{ app_user }}"
        group: service-accounts

    - name: Deploy per-host targets.yml
      ansible.builtin.template:
        src: ops-agent-targets.yml.j2
        dest: "{{ app_base_dir }}/current/targets.yml"
        owner: "{{ app_user }}"
        group: service-accounts
        mode: "0640"

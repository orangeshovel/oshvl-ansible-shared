---
# Jaeger role defaults

jaeger_user: jaeger
jaeger_base_dir: /opt/jaeger
# Kept traversable by service-accounts (mode 0775, group service-accounts) so
# other services' housekeeping (e.g. oshvl-ops-agent's log scan, which walks
# every /app-data/{app} looking for a logs/ subdir) doesn't hit a
# PermissionError here. jaeger_data_dir below stays private to jaeger_user.
jaeger_app_data_base: /app-data/jaeger
jaeger_data_dir: "{{ jaeger_app_data_base }}/data"
jaeger_version: "2.21.0"
jaeger_arch: "linux-amd64"

# Bounds local Badger storage growth — trace data otherwise accumulates
# forever on local disk with no external store to offload to. 7 days is
# generous for "what did this run do yesterday/last week" without needing
# to think about disk usage; bump per-caller if longer history is needed.
jaeger_span_ttl: "168h"

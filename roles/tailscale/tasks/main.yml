---
- name: Ensure prerequisites are installed
  ansible.builtin.apt:
    name:
      - apt-transport-https
      - ca-certificates
    state: present
    update_cache: yes

- name: Download Tailscale apt signing key
  ansible.builtin.get_url:
    # The old stable/debian/repo.gpg URL now returns 404; keys are per-release.
    url: "https://pkgs.tailscale.com/stable/debian/{{ ansible_distribution_release }}.noarmor.gpg"
    dest: /usr/share/keyrings/tailscale-archive-keyring.gpg
    mode: '0644'
  when: not ansible_check_mode

- name: Add Tailscale apt repository
  ansible.builtin.apt_repository:
    repo: "deb [signed-by=/usr/share/keyrings/tailscale-archive-keyring.gpg] https://pkgs.tailscale.com/stable/debian {{ ansible_distribution_release }} main"
    state: present
    filename: tailscale

- name: Update apt cache
  ansible.builtin.apt:
    update_cache: yes

- name: Install tailscale package
  ansible.builtin.apt:
    name: tailscale
    state: present

- name: Ensure tailscaled service is enabled and started
  ansible.builtin.service:
    name: tailscaled
    enabled: yes
    state: started

- name: Optionally run `tailscale up` when auth key provided
  ansible.builtin.command: >-
    tailscale up --authkey={{ tailscale_auth_key }} --accept-routes
  when: tailscale_auth_key is defined and tailscale_auth_key | length > 0
  register: tailscale_up
  changed_when: tailscale_up.rc == 0
